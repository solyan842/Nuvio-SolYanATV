name: Build Nuvio SolYan tvOS Horizontal Episodes

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout SolYan repo
        uses: actions/checkout@v4

      - name: Check Xcode
        shell: bash
        run: |
          echo "macOS:"
          sw_vers

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "tvOS SDK:"
          xcodebuild -showsdks | grep -i tvos || true

      - name: Save SolYan DetailsScreen
        shell: bash
        run: |
          cp \
            tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift \
            "$RUNNER_TEMP/SolYanDetailsScreen.swift"

          test -f "$RUNNER_TEMP/SolYanDetailsScreen.swift"
          echo "SUCCESS: SolYan DetailsScreen saved"

      - name: Clone clean NuvioTVOS upstream
        shell: bash
        run: |
          git clone --recursive \
            https://github.com/bobsupra/NuvioTVOS.git \
            NuvioTVOS

          cd NuvioTVOS
          echo "Upstream commit:"
          git rev-parse HEAD
          echo ""
          echo "Clean upstream status:"
          git status --short

      - name: Apply SolYan fixes with upstream horizontal episode rail
        shell: bash
        run: |
          TARGET="$GITHUB_WORKSPACE/NuvioTVOS/tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift"
          UPSTREAM="$RUNNER_TEMP/UpstreamDetailsScreen.swift"

          test -f "$TARGET" || {
            echo "ERROR: Upstream DetailsScreen.swift not found"
            exit 1
          }

          # Preserve the exact horizontal episode implementation from the
          # upstream checkout before applying the SolYan DetailsScreen.
          cp "$TARGET" "$UPSTREAM"
          cp "$RUNNER_TEMP/SolYanDetailsScreen.swift" "$TARGET"

          export TARGET UPSTREAM
          python3 <<'PY'
          import os
          from pathlib import Path

          target = Path(os.environ["TARGET"])
          upstream_path = Path(os.environ["UPSTREAM"])

          solyan = target.read_text()
          upstream = upstream_path.read_text()

          start_marker = "    private var episodeCardStrip: some View {"
          end_marker = "    @ViewBuilder\n    private var seasonSelector: some View {"

          def block_bounds(text, label):
              start = text.find(start_marker)
              if start < 0:
                  raise SystemExit(f"ERROR: {label} episodeCardStrip start marker not found")
              end = text.find(end_marker, start)
              if end < 0:
                  raise SystemExit(f"ERROR: {label} seasonSelector marker not found")
              if text.find(start_marker, start + 1) >= 0:
                  raise SystemExit(f"ERROR: {label} has multiple episodeCardStrip blocks")
              return start, end

          solyan_start, solyan_end = block_bounds(solyan, "SolYan")
          upstream_start, upstream_end = block_bounds(upstream, "upstream")

          upstream_episode_block = upstream[upstream_start:upstream_end]

          if "GeometryReader { geo in" not in upstream_episode_block:
              raise SystemExit("ERROR: upstream episode rail is not the expected horizontal GeometryReader implementation")
          if "HStack(alignment: .bottom" not in upstream_episode_block:
              raise SystemExit("ERROR: upstream horizontal HStack episode rail not found")
          if "episodeScrollIndex" not in upstream_episode_block:
              raise SystemExit("ERROR: upstream horizontal rail does not use episodeScrollIndex")

          merged = solyan[:solyan_start] + upstream_episode_block + solyan[solyan_end:]

          merged_start, merged_end = block_bounds(merged, "merged")
          merged_episode_block = merged[merged_start:merged_end]

          if "LazyVStack" in merged_episode_block:
              raise SystemExit("ERROR: vertical episode rail is still present after merge")
          if "GeometryReader { geo in" not in merged_episode_block:
              raise SystemExit("ERROR: horizontal episode rail verification failed")

          # Keep the SolYan backdrop focus isolation fix. The backdrop remains
          # visually present but cannot steal hit testing or accessibility focus.
          if ".allowsHitTesting(false)" not in merged:
              raise SystemExit("ERROR: backdrop .allowsHitTesting(false) fix is missing")
          if ".accessibilityHidden(true)" not in merged:
              raise SystemExit("ERROR: backdrop .accessibilityHidden(true) fix is missing")

          target.write_text(merged)
          print("SUCCESS: exact upstream horizontal episode rail restored")
          print("SUCCESS: SolYan backdrop focus isolation retained")
          PY

          cd "$GITHUB_WORKSPACE/NuvioTVOS"

          echo ""
          echo "Modified upstream files:"
          git status --short

          COUNT="$(git status --short | wc -l | tr -d ' ')"
          if [ "$COUNT" != "1" ]; then
            echo "ERROR: Expected exactly one modified source file"
            exit 1
          fi

          git status --short | \
            grep -q "tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift" || {
              echo "ERROR: Unexpected modified file"
              exit 1
            }

          echo ""
          echo "SUCCESS: only DetailsScreen.swift modified in upstream checkout"

      - name: Install Tuist
        shell: bash
        run: |
          if command -v tuist >/dev/null 2>&1; then
            tuist version
          else
            brew install tuist
            tuist version
          fi

      - name: Build unsigned tvOS IPA
        shell: bash
        working-directory: NuvioTVOS
        run: |
          chmod +x scripts/build-ipa.sh
          bash scripts/build-ipa.sh

      - name: Find IPA
        shell: bash
        run: |
          echo "Generated IPA:"
          find NuvioTVOS/build-ipa \
            -type f \
            -name "*.ipa" \
            -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-SolYan-tvOS-HorizontalEpisodes
          path: NuvioTVOS/build-ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
