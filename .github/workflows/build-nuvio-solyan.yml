name: Build Nuvio SolYan tvOS Details Fix

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout SolYan repo
        uses: actions/checkout@v4

      - name: Check Xcode
        shell: bash
        run: |
          echo "macOS:"
          sw_vers

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "tvOS SDK:"
          xcodebuild -showsdks | grep -i tvos || true

      - name: Save SolYan DetailsScreen patch
        shell: bash
        run: |
          cp \
            tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift \
            "$RUNNER_TEMP/DetailsScreen.swift"

          test -f "$RUNNER_TEMP/DetailsScreen.swift"

          echo "SUCCESS: SolYan DetailsScreen saved"

      - name: Clone clean NuvioTVOS upstream
        shell: bash
        run: |
          git clone --recursive \
            https://github.com/bobsupra/NuvioTVOS.git \
            NuvioTVOS

          cd NuvioTVOS

          echo "Upstream commit:"
          git rev-parse HEAD

          echo ""
          echo "Clean upstream status:"
          git status --short

      - name: Apply ONLY DetailsScreen fix
        shell: bash
        run: |
          TARGET="$GITHUB_WORKSPACE/NuvioTVOS/tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift"

          test -f "$TARGET" || {
            echo "ERROR: Upstream DetailsScreen.swift not found"
            exit 1
          }

          cp \
            "$RUNNER_TEMP/DetailsScreen.swift" \
            "$TARGET"

          cd "$GITHUB_WORKSPACE/NuvioTVOS"

          echo ""
          echo "Modified upstream files:"
          git status --short

          COUNT="$(git status --short | wc -l | tr -d ' ')"

          if [ "$COUNT" != "1" ]; then
            echo "ERROR: Expected exactly one modified source file"
            exit 1
          fi

          git status --short | \
            grep -q "tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift" || {
              echo "ERROR: Unexpected modified file"
              exit 1
            }

          echo ""
          echo "SUCCESS: Only DetailsScreen.swift modified"

      - name: Install Tuist
        shell: bash
        run: |
          if command -v tuist >/dev/null 2>&1; then
            tuist version
          else
            brew install tuist
            tuist version
          fi

      - name: Build unsigned tvOS IPA
        shell: bash
        working-directory: NuvioTVOS
        run: |
          chmod +x scripts/build-ipa.sh
          bash scripts/build-ipa.sh

      - name: Find IPA
        shell: bash
        run: |
          echo "Generated IPA:"
          find NuvioTVOS/build-ipa \
            -type f \
            -name "*.ipa" \
            -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-SolYan-tvOS-DetailsFix
          path: NuvioTVOS/build-ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
