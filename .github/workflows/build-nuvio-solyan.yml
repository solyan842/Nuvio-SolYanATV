name: Build Nuvio SolYan tvOS Details Fix 2

"on":
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout SolYan patch repo
        uses: actions/checkout@v4

      - name: Check Xcode
        shell: bash
        run: |
          echo "macOS:"
          sw_vers

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "tvOS SDK:"
          xcodebuild -showsdks | grep -i tvos || true

      - name: Clone clean NuvioTVOS upstream
        shell: bash
        run: |
          git clone --recursive https://github.com/bobsupra/NuvioTVOS.git NuvioTVOS

          cd NuvioTVOS

          echo "Upstream commit:"
          git rev-parse HEAD

          echo ""
          echo "Working tree before patch:"
          git status --short

      - name: Apply ONLY DetailsScreen fix
        shell: bash
        run: |
          SOURCE="$GITHUB_WORKSPACE/DetailsScreen.swift"
          TARGET="$GITHUB_WORKSPACE/NuvioTVOS/tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift"

          if [ ! -f "$SOURCE" ]; then
            echo "ERROR: DetailsScreen.swift not found in repo root"
            exit 1
          fi

          if [ ! -f "$TARGET" ]; then
            echo "ERROR: Upstream DetailsScreen.swift not found"
            exit 1
          fi

          cp "$SOURCE" "$TARGET"

          echo ""
          echo "Only modified source file should be DetailsScreen.swift:"
          cd "$GITHUB_WORKSPACE/NuvioTVOS"
          git status --short

          CHANGED="$(git status --short | wc -l | tr -d ' ')"

          if [ "$CHANGED" != "1" ]; then
            echo "ERROR: More than one upstream file was modified"
            git status --short
            exit 1
          fi

          if ! git status --short | grep -q "tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift"; then
            echo "ERROR: Unexpected modified file"
            git status --short
            exit 1
          fi

          echo ""
          echo "SUCCESS: Only DetailsScreen.swift was modified"

      - name: Install Tuist
        shell: bash
        run: |
          if command -v tuist >/dev/null 2>&1; then
            tuist version
          else
            brew install tuist
            tuist version
          fi

      - name: Build unsigned tvOS IPA
        shell: bash
        working-directory: NuvioTVOS
        run: |
          chmod +x scripts/build-ipa.sh
          bash scripts/build-ipa.sh

      - name: Find IPA
        shell: bash
        run: |
          find NuvioTVOS/build-ipa \
            -type f \
            -name "*.ipa" \
            -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-SolYan-tvOS-DetailsFix
          path: NuvioTVOS/build-ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
