name: Build Nuvio SolYan tvOS Xcode26

"on":
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Check Xcode
        shell: bash
        run: |
          echo "macOS:"
          sw_vers
          echo ""
          echo "Xcode:"
          xcodebuild -version
          echo ""
          echo "tvOS SDK:"
          xcodebuild -showsdks | grep -i tvos || true

      - name: Clone NuvioTVOS upstream
        shell: bash
        run: |
          git clone --recursive https://github.com/bobsupra/NuvioTVOS.git NuvioTVOS
          cd NuvioTVOS
          echo "Nuvio commit:"
          git rev-parse HEAD

      - name: Apply SolYan pagination fix
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          p = Path(
              "NuvioTVOS/tvosApp/NuvioTV/Sources/UI/Home/TVCatalogRow.swift"
          )

          if not p.exists():
              raise SystemExit(
                  "ERROR: TVCatalogRow.swift not found"
              )

          s = p.read_text(encoding="utf-8")

          if "SolYan tvOS pagination fallback" in s:
              print("SUCCESS: Fix already present")
              raise SystemExit(0)

          pattern = re.compile(
              r'(?P<block>'
              r'\.disabled\s*\(\s*'
              r'restrictFocusToCardKey\s*!=\s*nil\s*&&\s*'
              r'restrictFocusToCardKey\s*!=\s*cardKey\s*'
              r'\)'
              r')'
          )

          matches = list(pattern.finditer(s))

          if not matches:
              print("Diagnostic:")
              for i, line in enumerate(s.splitlines(), 1):
                  if (
                      ".disabled" in line
                      or "restrictFocusToCardKey" in line
                  ):
                      print(f"{i}: {line}")

              raise SystemExit(
                  "ERROR: Pagination insertion point not found"
              )

          m = matches[0]

          line_start = s.rfind("\n", 0, m.start()) + 1
          indent = s[line_start:m.start()]

          insertion = (
              "\n"
              f"{indent}.onAppear {{\n"
              f"{indent}    // SolYan tvOS pagination fallback\n"
              f"{indent}    if itemIndex >= max(items.count - 3, 0) {{\n"
              f"{indent}        onApproachEnd(item)\n"
              f"{indent}    }}\n"
              f"{indent}}}"
          )

          s = s[:m.end()] + insertion + s[m.end():]

          p.write_text(s, encoding="utf-8")

          verify = p.read_text(encoding="utf-8")

          if "SolYan tvOS pagination fallback" not in verify:
              raise SystemExit(
                  "ERROR: Pagination patch verification failed"
              )

          print("SUCCESS: SolYan pagination fix applied")
          PY

      - name: Install Tuist
        shell: bash
        run: |
          if command -v tuist >/dev/null 2>&1; then
            echo "Tuist already installed:"
            tuist version
          else
            brew install tuist
            tuist version
          fi

      - name: Build unsigned tvOS IPA
        shell: bash
        working-directory: NuvioTVOS
        run: |
          echo "Building with:"
          xcodebuild -version

          chmod +x scripts/build-ipa.sh
          bash scripts/build-ipa.sh

      - name: Find IPA
        shell: bash
        run: |
          echo "Generated IPA:"
          find NuvioTVOS/build-ipa \
            -type f \
            -name "*.ipa" \
            -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-SolYan-tvOS-Xcode26
          path: NuvioTVOS/build-ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
