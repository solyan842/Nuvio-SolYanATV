name: Build Nuvio SolYan tvOS Horizontal Episodes

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 60

    steps:
      - name: Checkout SolYan repo
        uses: actions/checkout@v4

      - name: Check Xcode
        shell: bash
        run: |
          echo "macOS:"
          sw_vers

          echo ""
          echo "Xcode:"
          xcodebuild -version

          echo ""
          echo "tvOS SDK:"
          xcodebuild -showsdks | grep -i tvos || true

      - name: Save SolYan DetailsScreen patch
        shell: bash
        run: |
          cp \
            tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift \
            "$RUNNER_TEMP/DetailsScreen.swift"

          test -f "$RUNNER_TEMP/DetailsScreen.swift"

          echo "SUCCESS: SolYan DetailsScreen saved"

      - name: Clone clean NuvioTVOS upstream
        shell: bash
        run: |
          git clone --recursive \
            https://github.com/bobsupra/NuvioTVOS.git \
            NuvioTVOS

          cd NuvioTVOS

          echo "Upstream commit:"
          git rev-parse HEAD

          echo ""
          echo "Clean upstream status:"
          git status --short

      - name: Apply SolYan fixes and restore horizontal episode rail
        shell: bash
        run: |
          TARGET="$GITHUB_WORKSPACE/NuvioTVOS/tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift"

          test -f "$TARGET" || {
            echo "ERROR: Upstream DetailsScreen.swift not found"
            exit 1
          }

          cp \
            "$RUNNER_TEMP/DetailsScreen.swift" \
            "$TARGET"

          export TARGET
          python3 <<'PY'
          import os
          from pathlib import Path

          target = Path(os.environ["TARGET"])
          text = target.read_text()

          old = '''    private var episodeCardStrip: some View {
              // SolYan tvOS fix: use a native vertical episode list instead of the
              // custom horizontally-offset rail. This lets the parent vertical
              // Details ScrollView and the tvOS focus engine move naturally through
              // the episode cards and continue to the sections below them.
              LazyVStack(alignment: .leading, spacing: TvEpisodeCardLayout.spacing) {
                  ForEach(seasonEpisodes) { video in
                      let itemIndex = seasonEpisodes.firstIndex(where: { $0.id == video.id }) ?? 0
                      TvEpisodeCard(
                          video: video,
                          fallbackRating: seriesRating,
                          continueProgress: continueProgress(for: video),
                          isWatched: watchedEpisodeKeys.contains("\\(video.season):\\(video.episode)"),
                          isSeasonWatched: isSeasonWatched,
                          onFocus: {
                              episodeScrollIndex = itemIndex
                              onFocus()
                          },
                          onToggleWatched: {
                              _ = WatchedStore.toggleEpisode(
                                  meta: meta,
                                  season: video.season,
                                  episode: video.episode
                              )
                          },
                          onToggleSeasonWatched: {
                              WatchedStore.setSeasonWatched(
                                  meta: meta,
                                  season: selectedSeason,
                                  episodes: seasonEpisodes.map(\\.episode),
                                  isWatched: !isSeasonWatched
                              )
                          },
                          onMenuOpened: { onEpisodeMenuPresented(true) },
                          onMenuClosed: { onEpisodeMenuPresented(false) },
                          action: { onSelect(video) },
                          onPlayManually: onPlayManually != nil ? { onPlayManually?(video) } : nil,
                          smartStreamSelection: smartStreamSelection,
                          focus: episodeFocus,
                          restrictFocusToKey: effectiveFocusRestriction,
                          onMoveDown: {
                              if itemIndex + 1 < seasonEpisodes.count {
                                  episodeFocus.wrappedValue = TvEpisodeFocus.card(seasonEpisodes[itemIndex + 1].id)
                              } else {
                                  onMoveDownFromEpisode()
                              }
                          },
                          onMoveUp: {
                              if itemIndex > 0 {
                                  episodeFocus.wrappedValue = TvEpisodeFocus.card(seasonEpisodes[itemIndex - 1].id)
                              } else {
                                  onMoveUpFromSeason()
                              }
                          }
                      )
                  }
              }
              .padding(.vertical, TvEpisodeCardLayout.verticalPadding)
          }'''.replace('          ', '      ')

          new = '''    private var episodeCardStrip: some View {
              GeometryReader { geo in
                  let edgeInset = max(0, geo.frame(in: .global).minX)
                  let stripWidth = geo.size.width + edgeInset * 2
                  let visibleCardCount = max(1, Int(ceil(stripWidth / TvEpisodeCardLayout.step)) + 1)
                  let materializedIndices = materializedEpisodeIndices(visibleCardCount: visibleCardCount)
                  let materializedEpisodes = materializedIndices.map { seasonEpisodes[$0] }

                  HStack(alignment: .bottom, spacing: TvEpisodeCardLayout.spacing) {
                      ForEach(materializedEpisodes) { video in
                          let itemIndex = seasonEpisodes.firstIndex(where: { $0.id == video.id }) ?? 0
                          TvEpisodeCard(
                              video: video,
                              fallbackRating: seriesRating,
                              continueProgress: continueProgress(for: video),
                              isWatched: watchedEpisodeKeys.contains("\\(video.season):\\(video.episode)"),
                              isSeasonWatched: isSeasonWatched,
                              onFocus: {
                                  episodeScrollIndex = itemIndex
                                  onFocus()
                              },
                              onToggleWatched: {
                                  _ = WatchedStore.toggleEpisode(
                                      meta: meta,
                                      season: video.season,
                                      episode: video.episode
                                  )
                              },
                              onToggleSeasonWatched: {
                                  WatchedStore.setSeasonWatched(
                                      meta: meta,
                                      season: selectedSeason,
                                      episodes: seasonEpisodes.map(\\.episode),
                                      isWatched: !isSeasonWatched
                                  )
                              },
                              onMenuOpened: { onEpisodeMenuPresented(true) },
                              onMenuClosed: { onEpisodeMenuPresented(false) },
                              action: { onSelect(video) },
                              onPlayManually: onPlayManually != nil ? { onPlayManually?(video) } : nil,
                              smartStreamSelection: smartStreamSelection,
                              focus: episodeFocus,
                              restrictFocusToKey: effectiveFocusRestriction,
                              onMoveDown: onMoveDownFromEpisode,
                              onMoveUp: seasons.count <= 1 ? onMoveUpFromSeason : nil
                          )
                      }
                  }
                  .padding(.leading, CGFloat(materializedIndices.first ?? 0) * TvEpisodeCardLayout.step)
                  .padding(.vertical, TvEpisodeCardLayout.verticalPadding)
                  .offset(x: edgeInset - CGFloat(episodeScrollIndex) * TvEpisodeCardLayout.step)
                  .frame(width: stripWidth, height: TvEpisodeCardLayout.stripHeight, alignment: .leading)
                  .offset(x: -edgeInset)
                  .animation(smoothFocus ? .spring(response: 0.3, dampingFraction: 1.0) : nil, value: episodeScrollIndex)
              }
              .frame(height: TvEpisodeCardLayout.stripHeight)
          }'''.replace('          ', '      ')

          if old not in text:
              raise SystemExit("ERROR: vertical episode rail block was not found; refusing an unsafe build")

          text = text.replace(old, new, 1)

          if "LazyVStack(alignment: .leading, spacing: TvEpisodeCardLayout.spacing)" in text:
              raise SystemExit("ERROR: vertical episode rail still present")
          if "GeometryReader { geo in" not in text or "episodeScrollIndex) * TvEpisodeCardLayout.step" not in text:
              raise SystemExit("ERROR: horizontal episode rail verification failed")
          if ".allowsHitTesting(false)" not in text or ".accessibilityHidden(true)" not in text:
              raise SystemExit("ERROR: backdrop focus isolation fix is missing")

          target.write_text(text)
          print("SUCCESS: horizontal episode rail restored")
          print("SUCCESS: backdrop remains excluded from hit testing/focus")
          PY

          cd "$GITHUB_WORKSPACE/NuvioTVOS"

          echo ""
          echo "Modified upstream files:"
          git status --short

          COUNT="$(git status --short | wc -l | tr -d ' ')"

          if [ "$COUNT" != "1" ]; then
            echo "ERROR: Expected exactly one modified source file"
            exit 1
          fi

          git status --short | \
            grep -q "tvosApp/NuvioTV/Sources/UI/Details/DetailsScreen.swift" || {
              echo "ERROR: Unexpected modified file"
              exit 1
            }

          echo ""
          echo "SUCCESS: only DetailsScreen.swift modified in upstream checkout"

      - name: Install Tuist
        shell: bash
        run: |
          if command -v tuist >/dev/null 2>&1; then
            tuist version
          else
            brew install tuist
            tuist version
          fi

      - name: Build unsigned tvOS IPA
        shell: bash
        working-directory: NuvioTVOS
        run: |
          chmod +x scripts/build-ipa.sh
          bash scripts/build-ipa.sh

      - name: Find IPA
        shell: bash
        run: |
          echo "Generated IPA:"
          find NuvioTVOS/build-ipa \
            -type f \
            -name "*.ipa" \
            -print

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Nuvio-SolYan-tvOS-HorizontalEpisodes
          path: NuvioTVOS/build-ipa/*.ipa
          if-no-files-found: error
          retention-days: 30
